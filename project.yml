name: VibeGames

options:
  bundleIdPrefix: party.vibegames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 11.15.0

targets:
  VibeGames:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      # The 81 card faces, one per combination. A folder reference keeps them in
      # their own directory in the bundle rather than dropping 81 loose files at
      # the root of it.
      - path: cards
        type: folder
        buildPhase: resources
    dependencies:
      # Realtime Database rather than Firestore: the schema is shared with the
      # existing web client, so both can sit in the same game.
      - package: Firebase
        product: FirebaseDatabase
      # App Check via App Attest, replacing the web client's reCAPTCHA.
      - package: Firebase
        product: FirebaseAppCheck
      # Crash reports. A crash is the one thing a player cannot tell us about,
      # so it has to arrive on its own.
      - package: Firebase
        product: FirebaseCrashlytics
      # Counts of things happening: games started and finished, screens opened.
      # The WithoutAdIdSupport variant on purpose — this app has no ads and no
      # use for the advertising identifier, so it never has to ask for tracking
      # permission and the App Store privacy answers stay simpler. The Swift
      # module is still `FirebaseAnalytics`.
      - package: Firebase
        product: FirebaseAnalyticsWithoutAdIdSupport
    # Crash reports are unreadable without this: it uploads the dSYMs so stack
    # traces arrive with function names rather than addresses.
    # After the build, not after compilation: the script reads the app's own
    # GoogleService-Info.plist out of the bundle, which is not there yet when a
    # post-compile phase runs.
    postBuildScripts:
      - name: Upload dSYMs to Crashlytics
        script: |
          # The uploader cannot find the app id on its own, so it is pointed at
          # the plist by hand. The file is git-ignored and optional — the app
          # runs without Firebase, solo play included — so a checkout that has
          # not been configured still builds.
          GSP="${SRCROOT}/Sources/GoogleService-Info.plist"
          if [ -f "$GSP" ]; then
            "${BUILD_DIR%Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" -gsp "$GSP"
          fi
        # Its work depends on the build, not on file timestamps.
        basedOnDependencyAnalysis: false
        # Declared so the script sandbox lets it read the file.
        inputFiles:
          - $(SRCROOT)/Sources/GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: party.vibegames.VibeGames
        PRODUCT_NAME: VibeGames
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2KBMDZ33ZL
        # Signing is left automatic so Xcode can manage it for a real device.
        # Pick your team in Xcode's Signing & Capabilities tab (or set
        # DEVELOPMENT_TEAM here) before building to a phone.
        # Headless simulator builds pass CODE_SIGNING_ALLOWED=NO on the
        # command line instead of baking it in here.
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Vibe Games
        CFBundleName: Vibe Games
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  VibeGamesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VibeGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: party.vibegames.VibeGamesTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VibeGames.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VibeGames"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  VibeGamesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VibeGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: party.vibegames.VibeGamesUITests
        TEST_TARGET_NAME: VibeGames
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  VibeGames:
    build:
      targets:
        VibeGames: all
        VibeGamesTests: [test]
        VibeGamesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VibeGamesTests
        - VibeGamesUITests
    archive:
      config: Release
