<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The Vibe Games mark: four tiles, one per game, in that game's gradient.
    The same four tiles are the iOS app icon (Tools/make_icon.swift), so the tab
    and the home screen carry one identity rather than two.
  -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1836"/><stop offset="1" stop-color="#0e0d1b"/>
    </linearGradient>
    <linearGradient id="five" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4757"/><stop offset="1" stop-color="#ff8c33"/>
    </linearGradient>
    <linearGradient id="words" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21b8a8"/><stop offset="1" stop-color="#4585f5"/>
    </linearGradient>
    <linearGradient id="sudoku" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8549f0"/><stop offset="1" stop-color="#db54c2"/>
    </linearGradient>
    <linearGradient id="trio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b929"/><stop offset="1" stop-color="#85d647"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="url(#ink)"/>
  <rect width="64" height="64" fill="url(#glow)"/>

  <rect x="9.5"  y="9.5"  width="20.4" height="20.4" rx="4.9" fill="url(#five)"/>
  <rect x="34.1" y="9.5"  width="20.4" height="20.4" rx="4.9" fill="url(#words)"/>
  <rect x="9.5"  y="34.1" width="20.4" height="20.4" rx="4.9" fill="url(#sudoku)"/>
  <rect x="34.1" y="34.1" width="20.4" height="20.4" rx="4.9" fill="url(#trio)"/>
</svg>
